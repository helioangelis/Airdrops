<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rastreador de Projetos</title>
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card2:#20242c; --border:#2a2f3a;
  --txt:#e8eaed; --txt2:#9aa0ab; --accent:#4f9dff; --green:#3ddc84; --red:#ff5c5c; --yellow:#ffc94a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,Roboto,Segoe UI,sans-serif; padding-bottom:70px;}
.header{position:sticky; top:0; background:var(--bg); padding:16px 16px 8px; z-index:10; border-bottom:1px solid var(--border);}
.header h1{font-size:20px; margin:0 0 10px;}
.tabs{display:flex; gap:8px; overflow-x:auto;}
.tab{padding:6px 14px; border-radius:20px; background:var(--card); color:var(--txt2); font-size:13px; white-space:nowrap; border:1px solid var(--border);}
.tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.content{padding:12px 16px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;}
.card img{width:36px; height:36px; border-radius:50%; background:#333;}
.card .icon-fallback{width:36px; height:36px; border-radius:50%; background:var(--card2); display:flex; align-items:center; justify-content:center; font-weight:bold; color:var(--accent);}
.card .info{flex:1; min-width:0;}
.card .name{font-weight:600; font-size:15px;}
.card .sym{color:var(--txt2); font-size:12px;}
.card .price{text-align:right;}
.card .price .val{font-weight:600;}
.up{color:var(--green);} .down{color:var(--red);}
.star{font-size:20px; color:var(--txt2); background:none; border:none; padding:4px;}
.star.fav{color:var(--yellow);}
.navbar{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); display:flex; z-index:20;}
.navbtn{flex:1; text-align:center; padding:10px 0 6px; background:none; border:none; color:var(--txt2); font-size:11px;}
.navbtn .ico{font-size:20px; display:block;}
.navbtn.active{color:var(--accent);}
.screen{display:none;}
.screen.active{display:block;}
input, textarea, select{width:100%; padding:10px 12px; background:var(--card2); border:1px solid var(--border); border-radius:10px; color:var(--txt); font-size:14px; margin-bottom:10px;}
label{font-size:12px; color:var(--txt2); display:block; margin-bottom:4px;}
button.btn{padding:10px 16px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600;}
button.btn.secondary{background:var(--card2); color:var(--txt); border:1px solid var(--border);}
button.btn.danger{background:var(--red); color:#fff;}
.row{display:flex; gap:8px;}
.row > *{flex:1;}
.search-results .card{cursor:pointer;}
.chip{display:inline-block; padding:3px 10px; border-radius:14px; background:var(--card2); font-size:11px; color:var(--txt2); margin:2px;}
.section-title{font-size:13px; color:var(--txt2); margin:14px 0 8px; text-transform:uppercase; letter-spacing:0.5px;}
.detail-header{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.detail-header img, .detail-header .icon-fallback{width:56px; height:56px;}
.back{background:none; border:none; color:var(--accent); font-size:15px; padding:8px 0; margin-bottom:6px;}
.empty{color:var(--txt2); text-align:center; padding:40px 20px; font-size:14px;}
.linkbtn{color:var(--accent); text-decoration:none; font-size:13px;}
.checklist{max-height:200px; overflow-y:auto;}
.checkitem{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border);}
.checkitem input{width:auto; margin:0;}
#toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--card2); color:var(--txt); padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:50; border:1px solid var(--border);}
#toast.show{opacity:1;}
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle">Rastreador de Projetos</h1>
  <div class="tabs" id="filterTabs"></div>
</div>

<div class="content">

  <div class="screen active" id="screen-home">
    <div id="homeList"></div>
  </div>

  <div class="screen" id="screen-add">
    <input type="text" id="searchInput" placeholder="Buscar projeto (ex: bitcoin, alphea)...">
    <div class="section-title" id="cgLabel" style="display:none;">CoinGecko</div>
    <div class="search-results" id="searchResults"></div>
    <div class="section-title" id="crLabel" style="display:none;">CryptoRank</div>
    <div class="search-results" id="crResults"></div>
    <div class="section-title">Não achou? Adicione manualmente</div>
    <label>Nome do projeto</label>
    <input type="text" id="manName">
    <label>Categoria</label>
    <input type="text" id="manCat" placeholder="ex: airdrop, DeFi, gaming">
    <label>Site</label>
    <input type="text" id="manSite" placeholder="https://...">
    <label>Twitter/X</label>
    <input type="text" id="manTwitter" placeholder="@usuario">
    <label>Notas</label>
    <textarea id="manNotes" rows="3"></textarea>
    <button class="btn" onclick="addManual()">Adicionar manualmente</button>
  </div>

  <div class="screen" id="screen-detail">
    <button class="back" onclick="showScreen('home')">← Voltar</button>
    <div id="detailBody"></div>
  </div>

  <div class="screen" id="screen-lists">
    <div class="row">
      <input type="text" id="newListName" placeholder="Nome da nova lista">
      <button class="btn" style="flex:0 0 auto;" onclick="createList()">Criar</button>
    </div>
    <div id="listsContainer"></div>
  </div>

  <div class="screen" id="screen-listdetail">
    <button class="back" onclick="showScreen('lists')">← Voltar</button>
    <div id="listDetailBody"></div>
  </div>

  <div class="screen" id="screen-settings">
    <div class="section-title">CryptoRank (opcional)</div>
    <label>API Key</label>
    <input type="text" id="cryptorankKey" placeholder="Sua chave da CryptoRank">
    <button class="btn secondary" onclick="saveSettings()">Salvar</button>
    <p style="color:var(--txt2); font-size:12px;">Se a CryptoRank bloquear a chamada pelo navegador (CORS), os dados dela precisam ser inseridos manualmente nas notas do projeto.</p>

    <div class="section-title">Backup (copiar/colar texto)</div>
    <button class="btn secondary" onclick="exportData()">Gerar backup (texto)</button>
    <textarea id="backupArea" rows="4" placeholder="Cole aqui um backup para importar"></textarea>
    <button class="btn secondary" onclick="importData()">Importar backup colado acima</button>
  </div>

</div>

<div id="toast"></div>

<div class="navbar">
  <button class="navbtn active" data-screen="home" onclick="showScreen('home')"><span class="ico">📋</span>Projetos</button>
  <button class="navbtn" data-screen="add" onclick="showScreen('add')"><span class="ico">➕</span>Adicionar</button>
  <button class="navbtn" data-screen="lists" onclick="showScreen('lists')"><span class="ico">🗂️</span>Listas</button>
  <button class="navbtn" data-screen="settings" onclick="showScreen('settings')"><span class="ico">⚙️</span>Config</button>
</div>

<script>
const DB = {
  get projects(){ return JSON.parse(localStorage.getItem('rpt_projects')||'[]'); },
  set projects(v){ localStorage.setItem('rpt_projects', JSON.stringify(v)); },
  get lists(){ return JSON.parse(localStorage.getItem('rpt_lists')||'[]'); },
  set lists(v){ localStorage.setItem('rpt_lists', JSON.stringify(v)); },
  get settings(){ return JSON.parse(localStorage.getItem('rpt_settings')||'{}'); },
  set settings(v){ localStorage.setItem('rpt_settings', JSON.stringify(v)); }
};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

let currentFilter = 'all';
let currentDetailId = null;
let currentListId = null;

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.screen===name));
  const titles = {home:'Rastreador de Projetos', add:'Adicionar Projeto', lists:'Minhas Listas', settings:'Configurações', detail:'', listdetail:''};
  document.getElementById('pageTitle').textContent = titles[name] ?? '';
  document.getElementById('filterTabs').style.display = (name==='home') ? 'flex' : 'none';
  if(name==='home') renderHome();
  if(name==='lists') renderLists();
  if(name==='settings') loadSettingsForm();
}

function renderFilterTabs(){
  const lists = DB.lists;
  let html = `<div class="tab ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">Todos</div>`;
  html += `<div class="tab ${currentFilter==='fav'?'active':''}" onclick="setFilter('fav')">⭐ Favoritos</div>`;
  lists.forEach(l=>{
    html += `<div class="tab ${currentFilter==='list:'+l.id?'active':''}" onclick="setFilter('list:${l.id}')">${esc(l.name)}</div>`;
  });
  document.getElementById('filterTabs').innerHTML = html;
}
function setFilter(f){ currentFilter=f; renderHome(); renderFilterTabs(); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderHome(){
  renderFilterTabs();
  let projects = DB.projects;
  if(currentFilter==='fav') projects = projects.filter(p=>p.favorite);
  else if(currentFilter.startsWith('list:')){
    const lid = currentFilter.split(':')[1];
    const list = DB.lists.find(l=>l.id===lid);
    projects = list ? projects.filter(p=>list.projectIds.includes(p.id)) : [];
  }
  const el = document.getElementById('homeList');
  if(projects.length===0){ el.innerHTML = '<div class="empty">Nenhum projeto aqui ainda.<br>Toque em "Adicionar" para começar.</div>'; return; }
  el.innerHTML = projects.map(p=>cardHtml(p)).join('');
}

function cardHtml(p){
  const cg = p.cgData || p.crData;
  const price = cg ? '$'+formatNum(cg.price) : '—';
  const chg = cg && cg.chg24!=null ? cg.chg24 : null;
  const chgHtml = chg==null ? '' : `<div class="${chg>=0?'up':'down'}">${chg>=0?'+':''}${chg.toFixed(2)}%</div>`;
  const img = p.image ? `<img src="${p.image}">` : `<div class="icon-fallback">${esc((p.name||'?')[0].toUpperCase())}</div>`;
  return `<div class="card" onclick="openDetail('${p.id}')">
    ${img}
    <div class="info">
      <div class="name">${esc(p.name)}</div>
      <div class="sym">${esc(p.symbol||p.category||'')}</div>
    </div>
    <div class="price">
      <div class="val">${price}</div>
      ${chgHtml}
    </div>
    <button class="star ${p.favorite?'fav':''}" onclick="event.stopPropagation(); toggleFav('${p.id}')">★</button>
  </div>`;
}
function formatNum(n){
  if(n==null) return '—';
  if(n<0.01) return n.toFixed(6);
  if(n<1) return n.toFixed(4);
  return n.toLocaleString('en-US',{maximumFractionDigits:2});
}
function toggleFav(id){
  const ps = DB.projects;
  const p = ps.find(x=>x.id===id);
  if(p){ p.favorite = !p.favorite; DB.projects = ps; renderHome(); if(currentDetailId===id) renderDetail(id); }
}

let searchTimer;
document.getElementById('searchInput').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if(q.length<2){
    document.getElementById('searchResults').innerHTML='';
    document.getElementById('crResults').innerHTML='';
    document.getElementById('cgLabel').style.display='none';
    document.getElementById('crLabel').style.display='none';
    return;
  }
  searchTimer = setTimeout(()=>{ doSearch(q); doSearchCryptoRank(q); }, 400);
});
async function doSearch(q){
  const lbl = document.getElementById('cgLabel'); lbl.style.display='block';
  const el = document.getElementById('searchResults');
  el.innerHTML = '<div class="empty">Buscando...</div>';
  try{
    const res = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(q)}`);
    const data = await res.json();
    const coins = (data.coins||[]).slice(0,8);
    if(coins.length===0){ el.innerHTML = '<div class="empty">Nada encontrado na CoinGecko.</div>'; return; }
    el.innerHTML = coins.map(c=>`<div class="card" onclick="addFromCoinGecko('${c.id}','${esc(c.name)}','${esc(c.symbol)}','${c.thumb}')">
      <img src="${c.thumb}">
      <div class="info"><div class="name">${esc(c.name)}</div><div class="sym">${esc(c.symbol.toUpperCase())} ${c.market_cap_rank?'· Rank #'+c.market_cap_rank:''}</div></div>
    </div>`).join('');
  }catch(err){
    el.innerHTML = '<div class="empty">Erro ao buscar na CoinGecko (sem internet?).</div>';
  }
}
async function doSearchCryptoRank(q){
  const key = DB.settings.cryptorankKey;
  const lbl = document.getElementById('crLabel');
  const el = document.getElementById('crResults');
  if(!key){ lbl.style.display='none'; el.innerHTML=''; return; }
  lbl.style.display='block';
  el.innerHTML = '<div class="empty">Buscando...</div>';
  try{
    const res = await fetch(`https://api.cryptorank.io/v3/currencies/search?query=${encodeURIComponent(q)}`, {
      headers: { 'X-Api-Key': key }
    });
    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      el.innerHTML = `<div class="empty">CryptoRank: erro ${res.status} ${errData.error?.message||''}. Confira a chave em Config.</div>`;
      return;
    }
    const data = await res.json();
    const coins = (data.data || []).slice(0,8);
    if(coins.length===0){ el.innerHTML = '<div class="empty">Nada encontrado na CryptoRank.</div>'; return; }
    el.innerHTML = coins.map(c=>{
      const img = c.imageUrl ? `<img src="${c.imageUrl}">` : `<div class="icon-fallback">${esc((c.name||'?')[0].toUpperCase())}</div>`;
      const rank = c.rank ? '· Rank #'+c.rank : '';
      return `<div class="card" onclick="addFromCryptoRank(${c.id},'${esc(c.name)}','${esc(c.symbol||'')}','${c.imageUrl||''}')">
        ${img}
        <div class="info"><div class="name">${esc(c.name)}</div><div class="sym">${esc((c.symbol||'').toUpperCase())} ${rank}</div></div>
      </div>`;
    }).join('');
  }catch(err){
    el.innerHTML = '<div class="empty">CryptoRank bloqueou a chamada direta do navegador (CORS) ou está fora do ar. Use cadastro manual e cole os dados nas notas.</div>';
  }
}
function addFromCryptoRank(id, name, symbol, imageUrl){
  const ps = DB.projects;
  if(ps.find(p=>p.crId===id)){ toast('Projeto já adicionado'); return; }
  const p = { id: uid(), name, symbol, source:'cryptorank', crId:id, image:imageUrl||null, favorite:false, notes:'', category:'', website:'', twitter:'', addedAt:Date.now() };
  ps.push(p); DB.projects = ps;
  toast('Adicionado! Buscando dados da CryptoRank...');
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').innerHTML=''; document.getElementById('crResults').innerHTML='';
  document.getElementById('cgLabel').style.display='none'; document.getElementById('crLabel').style.display='none';
  fetchCryptoRankDetails(p.id).then(()=>showScreen('home'));
}
async function fetchCryptoRankDetails(id){
  const ps = DB.projects; const p = ps.find(x=>x.id===id);
  const key = DB.settings.cryptorankKey;
  if(!p || !p.crId || !key) return;
  try{
    const res = await fetch(`https://api.cryptorank.io/v3/currencies/${p.crId}?convert=USD`, { headers: { 'X-Api-Key': key } });
    if(!res.ok) return;
    const d = await res.json();
    const c = d.data;
    if(!c) return;
    p.image = p.image || c.imageUrl;
    p.description = p.description || c.description;
    p.category = p.category || (c.category ? c.category.name : '');
    const links = c.links || [];
    const web = links.find(l=>l.type==='web');
    const tw = links.find(l=>l.type==='twitter');
    p.website = p.website || (web ? web.url : '');
    p.twitter = p.twitter || (tw ? '@'+tw.url.split('/').filter(Boolean).pop() : '');
    p.crData = {
      price: c.price!=null ? parseFloat(c.price) : null,
      chg24: c.pricePercentChange?.h24 ?? null,
      marketCap: c.marketCap!=null ? parseFloat(c.marketCap) : null,
      rank: c.rank,
      lifecycle: c.lifecycle,
      lastUpdated: Date.now()
    };
    DB.projects = ps;
  }catch(err){ console.log('erro cryptorank', err); }
}
function addFromCoinGecko(id, name, symbol, thumb){
  const ps = DB.projects;
  if(ps.find(p=>p.cgId===id)){ toast('Projeto já adicionado'); return; }
  const p = { id: uid(), name, symbol: symbol.toUpperCase(), source:'coingecko', cgId:id, image:thumb, favorite:false, notes:'', category:'', website:'', twitter:'', addedAt:Date.now() };
  ps.push(p); DB.projects = ps;
  toast('Adicionado! Buscando dados...');
  document.getElementById('searchInput').value=''; document.getElementById('searchResults').innerHTML='';
  fetchCoinGeckoDetails(p.id).then(()=>showScreen('home'));
}
function addManual(){
  const name = document.getElementById('manName').value.trim();
  if(!name){ toast('Digite um nome'); return; }
  const p = { id: uid(), name, symbol:'', source:'manual',
    category: document.getElementById('manCat').value.trim(),
    website: document.getElementById('manSite').value.trim(),
    twitter: document.getElementById('manTwitter').value.trim(),
    notes: document.getElementById('manNotes').value.trim(),
    favorite:false, addedAt:Date.now() };
  const ps = DB.projects; ps.push(p); DB.projects = ps;
  ['manName','manCat','manSite','manTwitter','manNotes'].forEach(id=>document.getElementById(id).value='');
  toast('Projeto adicionado manualmente');
  showScreen('home');
}

async function fetchCoinGeckoDetails(id){
  const ps = DB.projects; const p = ps.find(x=>x.id===id);
  if(!p || !p.cgId) return;
  try{
    const res = await fetch(`https://api.coingecko.com/api/v3/coins/${p.cgId}?localization=false&tickers=false&community_data=false&developer_data=false&sparkline=false`);
    const d = await res.json();
    p.image = d.image?.small || p.image;
    p.website = d.links?.homepage?.[0] || '';
    p.twitter = d.links?.twitter_screen_name ? '@'+d.links.twitter_screen_name : '';
    p.description = (d.description?.en||'').split('. ').slice(0,2).join('. ');
    p.cgData = {
      price: d.market_data?.current_price?.usd,
      chg24: d.market_data?.price_change_percentage_24h,
      marketCap: d.market_data?.market_cap?.usd,
      rank: d.market_cap_rank,
      lastUpdated: Date.now()
    };
    DB.projects = ps;
  }catch(err){ console.log('erro coingecko', err); }
}

function openDetail(id){ currentDetailId=id; showScreen('detail'); renderDetail(id); }
function renderDetail(id){
  const p = DB.projects.find(x=>x.id===id);
  if(!p) return;
  const cg = p.cgData;
  const img = p.image ? `<img src="${p.image}">` : `<div class="icon-fallback">${esc((p.name||'?')[0].toUpperCase())}</div>`;
  let html = `<div class="detail-header">${img}<div><div style="font-size:18px;font-weight:700">${esc(p.name)} ${p.symbol?'('+esc(p.symbol)+')':''}</div>
    <div style="color:var(--txt2);font-size:12px">${p.category?esc(p.category):(p.source==='coingecko'?'Criptomoeda':'Manual')}</div></div></div>`;

  if(cg){
    html += `<div class="section-title">Mercado</div>
    <div class="card" style="display:block;">
      <div class="row"><div>Preço<br><b>$${formatNum(cg.price)}</b></div>
      <div>24h<br><b class="${cg.chg24>=0?'up':'down'}">${cg.chg24!=null?cg.chg24.toFixed(2)+'%':'—'}</b></div>
      <div>Rank<br><b>${cg.rank?'#'+cg.rank:'—'}</b></div></div>
    </div>`;
  }
  if(p.description){ html += `<div class="section-title">Descrição</div><div class="card" style="display:block;font-size:13px;color:var(--txt2)">${esc(p.description)}</div>`; }

  if(p.crData){
    const cr = p.crData;
    html += `<div class="section-title">CryptoRank</div>
    <div class="card" style="display:block;">
      <div class="row"><div>Preço<br><b>$${formatNum(cr.price)}</b></div>
      <div>24h<br><b class="${cr.chg24>=0?'up':'down'}">${cr.chg24!=null?cr.chg24.toFixed(2)+'%':'—'}</b></div>
      <div>Rank<br><b>${cr.rank?'#'+cr.rank:'—'}</b></div></div>
    </div>`;
  }

  html += `<div class="section-title">Links</div><div class="card" style="display:block;">
    ${p.website?`<div><a class="linkbtn" href="${esc(p.website)}" target="_blank">🌐 ${esc(p.website)}</a></div>`:''}
    ${p.twitter?`<div style="margin-top:6px;"><a class="linkbtn" href="https://twitter.com/${esc((p.twitter||'').replace('@',''))}" target="_blank">🐦 ${esc(p.twitter)}</a></div>`:''}
    ${!p.website && !p.twitter ? '<span style="color:var(--txt2);font-size:13px;">Nenhum link cadastrado</span>':''}
  </div>`;

  html += `<div class="section-title">Suas notas</div><textarea id="detailNotes" rows="4" oninput="saveNotes('${p.id}', this.value)">${esc(p.notes||'')}</textarea>`;

  html += `<div class="section-title">Listas</div><div class="card checklist" style="display:block;">${listCheckboxesHtml(p.id)}</div>`;

  html += `<div class="row" style="margin-top:14px;">
    <button class="btn secondary" onclick="toggleFav('${p.id}')">${p.favorite?'★ Favoritado':'☆ Favoritar'}</button>
    ${p.source==='coingecko'?`<button class="btn secondary" onclick="fetchCoinGeckoDetails('${p.id}').then(()=>renderDetail('${p.id}'))">🔄 Atualizar CoinGecko</button>`:''}
    ${p.source==='cryptorank'?`<button class="btn secondary" onclick="fetchCryptoRankDetails('${p.id}').then(()=>renderDetail('${p.id}'))">🔄 Atualizar CryptoRank</button>`:''}
  </div>
  <div class="row" style="margin-top:8px;">
    <button class="btn" onclick="copyAiPrompt('${p.id}')">🤖 Copiar prompt p/ IA</button>
    <button class="btn danger" onclick="deleteProject('${p.id}')">🗑️ Excluir</button>
  </div>`;

  document.getElementById('detailBody').innerHTML = html;
}
function saveNotes(id, val){
  const ps = DB.projects; const p = ps.find(x=>x.id===id);
  if(p){ p.notes = val; DB.projects = ps; }
}
function listCheckboxesHtml(projectId){
  const lists = DB.lists;
  if(lists.length===0) return '<span style="color:var(--txt2);font-size:13px;">Nenhuma lista criada ainda.</span>';
  return lists.map(l=>`<div class="checkitem"><input type="checkbox" ${l.projectIds.includes(projectId)?'checked':''} onchange="toggleProjectInList('${l.id}','${projectId}', this.checked)"> ${esc(l.name)}</div>`).join('');
}
function toggleProjectInList(listId, projectId, checked){
  const lists = DB.lists; const l = lists.find(x=>x.id===listId);
  if(!l) return;
  if(checked){ if(!l.projectIds.includes(projectId)) l.projectIds.push(projectId); }
  else{ l.projectIds = l.projectIds.filter(id=>id!==projectId); }
  DB.lists = lists;
}
function deleteProject(id){
  if(!confirm('Excluir este projeto?')) return;
  let ps = DB.projects.filter(p=>p.id!==id); DB.projects = ps;
  let lists = DB.lists; lists.forEach(l=>l.projectIds=l.projectIds.filter(pid=>pid!==id)); DB.lists = lists;
  showScreen('home');
}
function copyAiPrompt(id){
  const p = DB.projects.find(x=>x.id===id);
  const prompt = `Pesquise as últimas notícias e atualizações sobre o projeto "${p.name}"${p.website?' (site: '+p.website+')':''}${p.twitter?' (twitter: '+p.twitter+')':''}. Traga: 1) principais novidades dos últimos 30 dias, 2) status do token/airdrop se houver, 3) sinais de alerta ou risco de golpe se houver.`;
  navigator.clipboard.writeText(prompt).then(()=>toast('Prompt copiado! Cole aqui no chat com o Claude.')).catch(()=>{ prompt_fallback(prompt); });
}
function prompt_fallback(text){ window.prompt('Copie o texto abaixo:', text); }

function createList(){
  const name = document.getElementById('newListName').value.trim();
  if(!name) return;
  const lists = DB.lists; lists.push({id:uid(), name, projectIds:[]}); DB.lists = lists;
  document.getElementById('newListName').value=''; renderLists();
}
function renderLists(){
  const lists = DB.lists;
  const el = document.getElementById('listsContainer');
  if(lists.length===0){ el.innerHTML = '<div class="empty">Nenhuma lista criada ainda.</div>'; return; }
  el.innerHTML = lists.map(l=>`<div class="card" onclick="openListDetail('${l.id}')">
    <div class="info"><div class="name">${esc(l.name)}</div><div class="sym">${l.projectIds.length} projeto(s)</div></div>
    <button class="star" onclick="event.stopPropagation(); deleteList('${l.id}')">🗑️</button>
  </div>`).join('');
}
function deleteList(id){
  if(!confirm('Excluir esta lista?')) return;
  DB.lists = DB.lists.filter(l=>l.id!==id); renderLists();
}
function openListDetail(id){
  currentListId = id; showScreen('listdetail'); renderListDetail();
}
function renderListDetail(){
  const l = DB.lists.find(x=>x.id===currentListId);
  if(!l) return;
  const projects = DB.projects.filter(p=>l.projectIds.includes(p.id));
  let html = `<h2 style="margin-top:0">${esc(l.name)}</h2>`;
  html += projects.length? projects.map(p=>cardHtml(p)).join('') : '<div class="empty">Nenhum projeto nesta lista ainda. Adicione pela tela de detalhes do projeto.</div>';
  document.getElementById('listDetailBody').innerHTML = html;
}

function loadSettingsForm(){
  document.getElementById('cryptorankKey').value = DB.settings.cryptorankKey || '';
}
function saveSettings(){
  DB.settings = { cryptorankKey: document.getElementById('cryptorankKey').value.trim() };
  toast('Configurações salvas');
}
function exportData(){
  const backup = { projects: DB.projects, lists: DB.lists, settings: DB.settings };
  document.getElementById('backupArea').value = JSON.stringify(backup);
  toast('Backup gerado abaixo — copie o texto');
}
function importData(){
  try{
    const data = JSON.parse(document.getElementById('backupArea').value);
    if(data.projects) DB.projects = data.projects;
    if(data.lists) DB.lists = data.lists;
    if(data.settings) DB.settings = data.settings;
    toast('Backup importado!');
    showScreen('home');
  }catch(err){ toast('JSON inválido'); }
}

showScreen('home');
</script>
</body>
</html>
